name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Prepare release files
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac
          safe_tag=$(printf '%s' "$TAG" | tr -cd 'A-Za-z0-9._-')
          [ "$safe_tag" = "$TAG" ] || { echo "Release tag contains unsupported characters" >&2; exit 1; }
          mkdir -p dist
          git archive --format=tar --prefix=luci-app-keylink/ "$TAG" | tar -xf - -C dist
          printf '%s\n' "$TAG" > dist/luci-app-keylink/VERSION

          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/openwrt/luci.git "$RUNNER_TEMP/luci"
          git -C "$RUNNER_TEMP/luci" sparse-checkout set modules/luci-base/src
          make -C "$RUNNER_TEMP/luci/modules/luci-base/src" po2lmo
          mkdir -p dist/luci-app-keylink/i18n
          "$RUNNER_TEMP/luci/modules/luci-base/src/po2lmo" \
            dist/luci-app-keylink/po/ru/keylink.po \
            dist/luci-app-keylink/i18n/keylink.ru.lmo

          sed "s|__REPO__|$REPOSITORY|g" install.sh > dist/install.sh
          tar -czf dist/luci-app-keylink.tar.gz -C dist luci-app-keylink

          mkdir -p dist/package-output
          chmod 777 dist/package-output

      - name: Build IPK package
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          docker run --rm \
            -v "$PWD/dist/luci-app-keylink:/source:ro" \
            -v "$PWD/dist/package-output:/output" \
            -e KEYLINK_REPO="$REPOSITORY" \
            -w /builder \
            openwrt/sdk:x86-64-23.05.6 \
            sh -ec '
              ./scripts/feeds update -a
              ./scripts/feeds install -a
              mkdir -p feeds/luci/applications/luci-app-keylink
              cp -R /source/. feeds/luci/applications/luci-app-keylink/
              ln -s ../../../feeds/luci/applications/luci-app-keylink \
                package/feeds/luci/luci-app-keylink
              make defconfig
              make package/luci-app-keylink/compile V=s -j2
              package=$(find bin/packages -type f -name "luci-app-keylink_*.ipk" -print -quit)
              [ -n "$package" ] || { echo "IPK package was not produced" >&2; exit 1; }
              cp "$package" /output/luci-app-keylink.ipk
            '

      - name: Build APK package
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          docker run --rm \
            -v "$PWD/dist/luci-app-keylink:/source:ro" \
            -v "$PWD/dist/package-output:/output" \
            -e KEYLINK_REPO="$REPOSITORY" \
            -w /builder \
            openwrt/sdk:x86-64-25.12.3 \
            sh -ec '
              ./scripts/feeds update -a
              ./scripts/feeds install -a
              mkdir -p feeds/luci/applications/luci-app-keylink
              cp -R /source/. feeds/luci/applications/luci-app-keylink/
              ln -s ../../../feeds/luci/applications/luci-app-keylink \
                package/feeds/luci/luci-app-keylink
              make defconfig
              make package/luci-app-keylink/compile V=s -j2
              package=$(find bin/packages -type f -name "luci-app-keylink-*.apk" -print -quit)
              [ -n "$package" ] || { echo "APK package was not produced" >&2; exit 1; }
              cp "$package" /output/luci-app-keylink.apk
            '
          cp dist/package-output/luci-app-keylink.ipk dist/
          cp dist/package-output/luci-app-keylink.apk dist/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/luci-app-keylink.tar.gz \
            dist/install.sh \
            dist/luci-app-keylink.ipk \
            dist/luci-app-keylink.apk \
            --title "$TAG" \
            --generate-notes
